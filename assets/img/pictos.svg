<svg xmlns="http://www.w3.org/2000/svg">
<!--
  Фирменные пиктограммы «Сто дорог»: сетка 64×64, контур 4, чёрный + оранжевый + белый.
  Сайт вставляет их в страницу через View::picto(), цвета задаются переменными:
  --p-ink (контур и массы), --p-accent (оранжевый), --p-paper (белые детали). На тёмном фоне ink → белый, paper → фон.
  Классы: i/a/p — заливка ink/accent/paper, n — без заливки, si/sa/sp — обводка ink/accent/paper.
-->
<style>.i{fill:var(--p-ink,#2d2926)}.a{fill:var(--p-accent,#f07714)}.p{fill:var(--p-paper,#fff)}.n{fill:none}.si{stroke:var(--p-ink,#2d2926)}.sa{stroke:var(--p-accent,#f07714)}.sp{stroke:var(--p-paper,#fff)}symbol{stroke-linecap:round;stroke-linejoin:round}</style>

<symbol id="steering" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="23" class="n si" stroke-width="7"/>
  <path d="M10.4 24.1a23 23 0 0 0 0 15.8M53.6 24.1a23 23 0 0 1 0 15.8" class="n sa" stroke-width="7" stroke-linecap="butt"/>
  <path d="M11 33c6-4 13-6 21-6s15 2 21 6M32 40v13" class="n si" stroke-width="7"/>
  <circle cx="32" cy="33" r="8.5" class="a si" stroke-width="4"/>
</symbol>

<symbol id="gear" viewBox="0 0 64 64">
  <rect x="13" y="55" width="38" height="6" rx="3" class="i"/>
  <path d="M20 57l4.5-14h15L44 57z" class="i"/>
  <rect x="28.5" y="24" width="7" height="22" rx="3" class="i"/>
  <circle cx="32" cy="18" r="13" class="a si" stroke-width="4"/>
  <path d="M26.5 12.5v11M32 12.5v11M37.5 12.5v11M26.5 18h11" class="n sp" stroke-width="2.6"/>
</symbol>

<symbol id="key" viewBox="0 0 64 64">
  <g transform="translate(32 33) rotate(40) scale(1.08) translate(-32 -31)">
    <rect x="21" y="2" width="22" height="31" rx="9" class="i"/>
    <rect x="26" y="8" width="12" height="8" rx="3" class="a"/>
    <rect x="26" y="19" width="12" height="8" rx="3" class="a"/>
    <rect x="27" y="32" width="10" height="5" rx="1.5" class="i"/>
    <path d="M28 36h8v12l-2.5 2.5 2.5 2.5v4l-4 4-4-4z" class="p si" stroke-width="3.5"/>
  </g>
</symbol>

<symbol id="cone" viewBox="0 0 64 64">
  <rect x="9" y="50" width="46" height="8" rx="3" class="i"/>
  <path d="M26.5 7h11L48 51H16z" class="a"/>
  <path d="M23.2 21h17.6l1.7 7h-21zM19.8 35h24.4l1.7 7H18.1z" class="p"/>
  <path d="M26.5 7h11L48 51H16z" class="n si" stroke-width="4"/>
</symbol>

<symbol id="calendar" viewBox="0 0 64 64">
  <rect x="7" y="13" width="50" height="44" rx="8" class="p si" stroke-width="4"/>
  <path d="M15 13h34a8 8 0 0 1 8 8v6H7v-6a8 8 0 0 1 8-8z" class="a si" stroke-width="4"/>
  <path d="M21 7v11M43 7v11" class="n si" stroke-width="5"/>
  <rect x="15" y="34" width="7" height="6" rx="1.5" class="i"/>
  <rect x="28.5" y="34" width="7" height="6" rx="1.5" class="i"/>
