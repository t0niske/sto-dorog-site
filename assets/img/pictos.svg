  <rect x="38" y="29" width="21" height="14" rx="7" class="a si" stroke-width="4"/>
  <circle cx="47.5" cy="36" r="2.6" class="p"/>
  <circle cx="16" cy="51" r="9" class="a si" stroke-width="4"/>
  <circle cx="16" cy="51" r="3.6" class="n si" stroke-width="2.4"/>
</symbol>

